# Arcana — run everything in containers.
#   pnpm docker:dev    dev server with hot reload   -> http://localhost:${ARCANA_PORT:-3100}
#   pnpm docker:check  typecheck + lint + unit tests
#   pnpm docker:e2e    build, start and run Playwright
#   pnpm docker:prod   production build, restarts automatically
# The project folder is bind-mounted, so node_modules and .pnpm-store live on the host (editor IntelliSense works).
x-dev: &dev
  build: { context: ., target: dev }
  user: '${ARCANA_UID:-1000}:${ARCANA_GID:-1000}'
  working_dir: /app
  environment:
    HOME: /tmp
    WATCHPACK_POLLING: '${WATCHPACK_POLLING:-false}'
    # Journal dates are shown in this time zone (the container would otherwise be on UTC).
    TZ: '${ARCANA_TZ:-UTC}'
  volumes:
    - .:/app

services:
  app:
    <<: *dev
    ports:
      - '${ARCANA_PORT:-3100}:3000'

  e2e:
    <<: *dev
    profiles: [e2e]
    build: { context: ., target: e2e }
    ports: []
    environment:
      HOME: /tmp
      ARCANA_DIST_DIR: .next-e2e
      # The tests keep their own throw-away databases (see playwright.config.ts); this is only a
      # safety net so nothing run in this container can write to the real journal in data/.
      ARCANA_DB_PATH: /tmp/arcana-e2e-default/arcana.db

  app-prod:
    profiles: [prod]
    build: { context: ., target: runner }
    restart: unless-stopped
    # The database lives in ./data on the host, so it survives restarts and image rebuilds.
    # `pnpm docker:prod` creates the folder first so Docker does not create it owned by root.
    user: '${ARCANA_UID:-1000}:${ARCANA_GID:-1000}'
    environment:
      TZ: '${ARCANA_TZ:-UTC}'
      ARCANA_DB_PATH: /app/data/arcana.db
    volumes:
      - ./data:/app/data
    ports:
      - '${ARCANA_PORT:-3100}:3000'
